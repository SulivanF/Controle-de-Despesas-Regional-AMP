<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Despesas Regional Ampére</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#111827',
                            card: '#1F2937',
                            border: '#374151',
                            text: '#F3F4F6',
                            muted: '#9CA3AF'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-dark-bg text-gray-800 dark:text-dark-text min-h-screen transition-colors duration-200">

    <!-- Header -->
    <header class="bg-white dark:bg-dark-card shadow-sm border-b border-gray-200 dark:border-dark-border">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-red-600 text-white p-2.5 rounded-lg shadow-md">
                    <i class="fa-solid fa-clipboard-list text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">CONTROLE DE DESPESAS REGIONAL AMPÉRE</h1>
                    <p class="text-xs text-gray-500 dark:text-dark-muted">Gestão de almoços e despesas da equipe técnica</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="toggleDarkMode()" class="p-2.5 rounded-lg bg-gray-100 dark:bg-dark-border text-gray-600 dark:text-yellow-400 hover:bg-gray-200 dark:hover:bg-gray-700 transition" title="Alternar Tema">
                    <i id="themeIcon" class="fa-solid fa-sun"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Action Bar & Filter -->
        <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 bg-white dark:bg-dark-card p-4 rounded-xl shadow-sm border border-gray-200 dark:border-dark-border">
            <div class="flex flex-wrap items-center gap-3">
                <button onclick="openModal()" class="bg-red-600 hover:bg-red-700 text-white font-medium px-4 py-2.5 rounded-lg shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Registrar Despesa
                </button>
            </div>

            <div class="flex flex-wrap items-center gap-3">
                <div class="flex items-center gap-2 bg-gray-50 dark:bg-dark-border px-3 py-2 rounded-lg border border-gray-200 dark:border-gray-700">
                    <i class="fa-regular fa-calendar text-gray-500 dark:text-dark-muted"></i>
                    <span class="text-xs font-semibold text-gray-500 dark:text-dark-muted uppercase">Período:</span>
                    <select id="filtroMes" onchange="filtrarPorMes()" class="bg-transparent text-sm font-medium focus:outline-none cursor-pointer">
                        <option value="todos">Todos os Meses</option>
                        <option value="2026-06" selected>Junho / 2026</option>
                        <option value="2026-07">Julho / 2026</option>
                    </select>
                </div>

                <button onclick="exportarPDF()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2.5 rounded-lg shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-file-pdf"></i> Exportar PDF
                </button>
            </div>
        </div>

        <!-- Cards Totais -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white dark:bg-dark-card p-5 rounded-xl shadow-sm border border-gray-200 dark:border-dark-border">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Despesa Total</p>
                <h3 id="cardTotal" class="text-2xl font-extrabold text-red-600 mt-1">R$ 0,00</h3>
            </div>
            <div class="bg-white dark:bg-dark-card p-5 rounded-xl shadow-sm border border-gray-200 dark:border-dark-border">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Média por Almoço</p>
                <h3 id="cardMediaAlmoco" class="text-2xl font-extrabold mt-1">R$ 0,00</h3>
            </div>
            <div class="bg-white dark:bg-dark-card p-5 rounded-xl shadow-sm border border-gray-200 dark:border-dark-border">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Danos e Outros</p>
                <h3 id="cardDanosOutros" class="text-2xl font-extrabold mt-1">R$ 0,00</h3>
            </div>
            <div class="bg-white dark:bg-dark-card p-5 rounded-xl shadow-sm border border-gray-200 dark:border-dark-border">
                <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Lançamentos</p>
                <h3 id="cardLancamentos" class="text-2xl font-extrabold mt-1">0</h3>
            </div>
        </div>

        <!-- Tabela Detalhamento -->
        <div class="bg-white dark:bg-dark-card rounded-xl shadow-sm border border-gray-200 dark:border-dark-border overflow-hidden">
            <div class="p-4 border-b border-gray-200 dark:border-dark-border">
                <h3 class="font-bold text-base">Detalhamento das Despesas</h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-gray-50 dark:bg-dark-border text-gray-500 dark:text-dark-muted uppercase text-xs tracking-wider">
                            <th class="p-4 font-semibold">Data</th>
                            <th class="p-4 font-semibold">Técnico</th>
                            <th class="p-4 font-semibold">Cidade</th>
                            <th class="p-4 font-semibold">Tipo</th>
                            <th class="p-4 font-semibold">Valor</th>
                            <th class="p-4 font-semibold text-center">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaDespesas" class="divide-y divide-gray-200 dark:divide-dark-border">
                        <!-- Inserido via JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Modal Registrar / Editar Despesa -->
    <div id="modalDespesa" class="fixed inset-0 bg-black/60 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
        <div class="bg-white dark:bg-dark-card w-full max-w-lg rounded-2xl shadow-xl border border-gray-200 dark:border-dark-border overflow-hidden animate-in fade-in zoom-in-95 duration-200">
            <div class="px-6 py-4 border-b border-gray-200 dark:border-dark-border flex justify-between items-center">
                <h3 id="modalTitulo" class="font-bold text-lg">Registrar Nova Despesa</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-white p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="formDespesa" onsubmit="salvarDespesa(event)" class="p-6 space-y-4">
                <input type="hidden" id="editIndex" value="">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase mb-1 text-gray-500 dark:text-dark-muted">Data</label>
                        <input type="date" id="data" required class="w-full bg-gray-50 dark:bg-dark-border border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase mb-1 text-gray-500 dark:text-dark-muted">Técnico</label>
                        <input type="text" id="tecnico" placeholder="Nome do técnico" required class="w-full bg-gray-50 dark:bg-dark-border border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase mb-1 text-gray-500 dark:text-dark-muted">Cidade</label>
                        <input type="text" id="cidade" placeholder="Ex: Capitão, Realeza..." required class="w-full bg-gray-50 dark:bg-dark-border border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase mb-1 text-gray-500 dark:text-dark-muted">Tipo</label>
                        <select id="tipo" onchange="tratarTipoDespesa()" class="w-full bg-gray-50 dark:bg-dark-border border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500 cursor-pointer">
                            <option value="Almoço">Almoço</option>
                            <option value="Danos Residenciais">Danos Residenciais</option>
                            <option value="Outros">Outros</option>
                        </select>
                    </div>
                </div>

                <!-- Nova aba abaixo para especificar se for Outros -->
                <div id="containerEspecificarOutros" class="hidden">
                    <label class="block text-xs font-semibold uppercase mb-1 text-gray-500 dark:text-dark-muted">Especificar Despesa (Outros)</label>
                    <input type="text" id="especificarOutros" placeholder="Descreva o motivo da despesa" class="w-full bg-gray-50 dark:bg-dark-border border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase mb-1 text-gray-500 dark:text-dark-muted">Valor (R$)</label>
                    <input type="number" step="0.01" id="valor" placeholder="0,00" required class="w-full bg-gray-50 dark:bg-dark-border border border-gray-300 dark:border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500">
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-gray-200 dark:border-dark-border">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg border border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-dark-border text-sm font-medium transition">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-medium shadow transition">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Gestão -->
    <script>
        let despesas = [
            { data: '2026-06-25', tecnico: 'Rodrigo', cidade: 'Capitão', tipo: 'Outros', detalheOutros: 'Outros', valor: 6.60 },
            { data: '2026-06-23', tecnico: 'Kuan', cidade: 'Realeza', tipo: 'Almoço', detalheOutros: '', valor: 60.00 },
            { data: '2026-06-23', tecnico: 'Alessandro', cidade: 'Realeza', tipo: 'Almoço', detalheOutros: '', valor: 60.00 },
            { data: '2026-06-24', tecnico: 'Sulivan', cidade: 'Realeza', tipo: 'Almoço', detalheOutros: '', valor: 43.00 },
            { data: '2026-06-23', tecnico: 'Rodrigo', cidade: 'Capitão', tipo: 'Almoço', detalheOutros: '', valor: 55.00 },
            { data: '2026-06-23', tecnico: 'Renan Fagundes', cidade: 'Capitão', tipo: 'Almoço', detalheOutros: '', valor: 55.00 },
            { data: '2026-06-26', tecnico: 'Cleverson', cidade: 'Dois Vizinhos', tipo: 'Almoço', detalheOutros: '', valor: 45.00 },
            { data: '2026-06-26', tecnico: 'Renan Tartari', cidade: 'Dois Vizinhos', tipo: 'Almoço', detalheOutros: '', valor: 45.00 },
            { data: '2026-06-30', tecnico: 'Rodrigo', cidade: 'Capitão', tipo: 'Almoço', detalheOutros: '', valor: 60.00 },
            { data: '2026-06-30', tecnico: 'Renan Fagundes', cidade: 'Capitão', tipo: 'Almoço', detalheOutros: '', valor: 60.00 }
        ];

        // Carregar dados salvos se houver
        if (localStorage.getItem('despesas_ampere')) {
            despesas = JSON.parse(localStorage.getItem('despesas_ampere'));
        }

        function salvarLocalStorage() {
            localStorage.setItem('despesas_ampere', JSON.stringify(despesas));
        }

        function formatarMoeda(valor) {
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function formatarData(dataStr) {
            if (!dataStr) return '';
            const partes = dataStr.split('-');
            if (partes.length === 3) {
                return `${partes[2]}/${partes[1]}/${partes[0]}`;
            }
            return dataStr;
        }

        function tratarTipoDespesa() {
            const tipo = document.getElementById('tipo').value;
            const container = document.getElementById('containerEspecificarOutros');
            const inputOutros = document.getElementById('especificarOutros');

            if (tipo === 'Outros') {
                container.classList.remove('hidden');
                inputOutros.required = true;
            } else {
                container.classList.add('hidden');
                inputOutros.required = false;
                inputOutros.value = '';
            }
        }

        function renderizar() {
            const filtroMes = document.getElementById('filtroMes').value;
            const tbody = document.getElementById('tabelaDespesas');
            tbody.innerHTML = '';

            let totalGeral = 0;
            let somaAlmoco = 0;
            let qtdAlmoco = 0;
            let somaDanosOutros = 0;
            let countLancamentos = 0;

            despesas.forEach((item, index) => {
                const mesItem = item.data.substring(0, 7); // yyyy-MM
                if (filtroMes !== 'todos' && mesItem !== filtroMes) {
                    return;
                }

                countLancamentos++;
                totalGeral += item.valor;

                if (item.tipo === 'Almoço') {
                    somaAlmoco += item.valor;
                    qtdAlmoco++;
                } else {
                    somaDanosOutros += item.valor;
                }

                let tipoTexto = item.tipo;
                if (item.tipo === 'Outros' && item.detalheOutros) {
                    tipoTexto = `Outros (${item.detalheOutros})`;
                }

                let badgeColor = 'bg-blue-100 text-blue-700 dark:bg-blue-900/40 dark:text-blue-300';
                if (item.tipo === 'Danos Residenciais') {
                    badgeColor = 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300';
                } else if (item.tipo === 'Outros') {
                    badgeColor = 'bg-purple-100 text-purple-700 dark:bg-purple-900/40 dark:text-purple-300';
                }

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50/50 dark:hover:bg-dark-border/40 transition';
                tr.innerHTML = `
                    <td class="p-4 font-medium">${formatarData(item.data)}</td>
                    <td class="p-4">${item.tecnico}</td>
                    <td class="p-4">${item.cidade}</td>
                    <td class="p-4"><span class="px-2.5 py-1 rounded-md text-xs font-semibold ${badgeColor}">${tipoTexto}</span></td>
                    <td class="p-4 font-semibold">${formatarMoeda(item.valor)}</td>
                    <td class="p-4 text-center space-x-3">
                        <button onclick="editarDespesa(${index})" class="text-blue-600 hover:text-blue-800 dark:text-blue-400 font-medium transition text-xs">Editar</button>
                        <button onclick="deletarDespesa(${index})" class="text-red-600 hover:text-red-800 dark:text-red-400 font-medium transition text-xs">Deletar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            const mediaAlmoco = qtdAlmoco > 0 ? somaAlmoco / qtdAlmoco : 0;

            document.getElementById('cardTotal').innerText = formatarMoeda(totalGeral);
            document.getElementById('cardMediaAlmoco').innerText = formatarMoeda(mediaAlmoco);
            document.getElementById('cardDanosOutros').innerText = formatarMoeda(somaDanosOutros);
            document.getElementById('cardLancamentos').innerText = countLancamentos;
        }

        function filtrarPorMes() {
            renderizar();
        }

        function openModal() {
            document.getElementById('modalTitulo').innerText = 'Registrar Nova Despesa';
            document.getElementById('editIndex').value = '';
            document.getElementById('formDespesa').reset();
            document.getElementById('containerEspecificarOutros').classList.add('hidden');
            document.getElementById('modalDespesa').classList.remove('hidden');
            document.getElementById('modalDespesa').classList.add('flex');
            
            // Definir data padrão de hoje se vazio
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('data').value = hoje;
        }

        function closeModal() {
            document.getElementById('modalDespesa').classList.remove('flex');
            document.getElementById('modalDespesa').classList.add('hidden');
        }

        function editarDespesa(index) {
            const item = despesas[index];
            document.getElementById('modalTitulo').innerText = 'Editar Despesa';
            document.getElementById('editIndex').value = index;
            document.getElementById('data').value = item.data;
            document.getElementById('tecnico').value = item.tecnico;
            document.getElementById('cidade').value = item.cidade;
            document.getElementById('tipo').value = item.tipo;
            
            tratarTipoDespesa();
            if (item.tipo === 'Outros') {
                document.getElementById('especificarOutros').value = item.detalheOutros || '';
            }

            document.getElementById('valor').value = item.valor;

            document.getElementById('modalDespesa').classList.remove('hidden');
            document.getElementById('modalDespesa').classList.add('flex');
        }

        function salvarDespesa(event) {
            event.preventDefault();
            const index = document.getElementById('editIndex').value;
            const tipo = document.getElementById('tipo').value;
            const detalheOutros = tipo === 'Outros' ? document.getElementById('especificarOutros').value : '';

            const novaDespesa = {
                data: document.getElementById('data').value,
                tecnico: document.getElementById('tecnico').value,
                cidade: document.getElementById('cidade').value,
                tipo: tipo,
                detalheOutros: detalheOutros,
                valor: parseFloat(document.getElementById('valor').value)
            };

            if (index === '') {
                despesas.unshift(novaDespesa);
            } else {
                despesas[index] = novaDespesa;
            }

            salvarLocalStorage();
            closeModal();
            renderizar();
        }

        function deletarDespesa(index) {
            if (confirm('Deseja realmente excluir esta despesa?')) {
                despesas.splice(index, 1);
                salvarLocalStorage();
                renderizar();
            }
        }

        function toggleDarkMode() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.className = 'fa-solid fa-sun';
                localStorage.setItem('theme', 'light');
            } else {
                html.classList.add('dark');
                icon.className = 'fa-solid fa-moon';
                localStorage.setItem('theme', 'dark');
            }
        }

        // Inicializar Tema e Renderização
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('themeIcon').className = 'fa-solid fa-moon';
        }

        function exportarPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFontSize(16);
            doc.text("Controle de Despesas Regional Ampére", 14, 20);
            
            doc.setFontSize(10);
            doc.text(`Gerado em: ${new Date().toLocaleDateString('pt-BR')}`, 14, 28);

            const filtroMes = document.getElementById('filtroMes').value;
            const dadosFiltrados = despesas.filter(item => {
                if (filtroMes === 'todos') return true;
                return item.data.substring(0, 7) === filtroMes;
            });

            const colunas = ["Data", "Técnico", "Cidade", "Tipo", "Valor"];
            const linhas = dadosFiltrados.map(item => [
                formatarData(item.data),
                item.tecnico,
                item.cidade,
                item.tipo === 'Outros' && item.detalheOutros ? `Outros (${item.detalheOutros})` : item.tipo,
                formatarMoeda(item.valor)
            ]);

            doc.autoTable({
                startY: 35,
                head: [colunas],
                body: linhas,
                theme: 'grid',
                headStyles: { fillColor: [220, 38, 38] }
            });

            doc.save("controle-despesas-ampere.pdf");
        }

        renderizar();
    </script>
</body>
</html>
